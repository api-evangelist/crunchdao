overlay: 1.0.0
info:
  title: API Evangelist enhancements for CrunchDAO Tournament API
  version: 1.0.0
extends: openapi/crunchdao-tournament-openapi.json
actions:
- target: $.info
  update:
    x-apievangelist-enriched: '2026-07-18'
    x-api-provider: CrunchDAO
    x-authentication: authentication/crunchdao-authentication.yml
    x-conventions: conventions/crunchdao-conventions.yml
    x-error-catalog: errors/crunchdao-problem-types.yml
    x-lifecycle: lifecycle/crunchdao-lifecycle.yml
- target: $.servers
  update:
  - url: https://api.hub.crunchdao.com
    description: CrunchDAO Tournament API (HTTPS; the generated spec advertises http)
- target: $.externalDocs
  update:
    description: CrunchDAO developer documentation
    url: https://docs.crunchdao.com/technical/tournament-api
