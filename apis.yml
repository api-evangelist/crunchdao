aid: crunchdao
name: CrunchDAO
description: 'CrunchDAO is a collective-intelligence platform that crowdsources machine-learning
  models from a global community of data scientists and PhDs to solve forecasting,
  classification, anomaly-detection and causal-discovery problems across finance, crypto
  and life sciences. Participants join real-time and structured competitions (Numinous,
  Falcon, Synth, DataCrunch, ADIA Lab, Broad Institute) on Crunch Hub, submit models
  with the official crunch-cli, and earn rewards. The Tournament API (api.hub.crunchdao.com)
  exposes competitions, rounds, phases, leaderboards, projects, submissions and predictions
  as a versioned REST API secured with API keys and bearer access tokens.'
url: https://raw.githubusercontent.com/api-evangelist/crunchdao/refs/heads/main/apis.yml
