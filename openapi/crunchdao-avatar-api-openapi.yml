openapi: 3.2.0
info:
  title: Tournament Avatar API
  description: CrunchDAO Tournament Platform API Endpoints
  version: v2
servers:
- url: http://api.hub.crunchdao.com
  description: Generated server url
security: []
tags:
- name: Avatar
paths:
  /v3/users/{userIdentifier}/avatar:
    x-service-id: account-service
    get:
      tags:
      - Avatar
      summary: Redirect to a user's avatar
      operationId: redirect
      parameters:
      - name: userIdentifier
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: temporaryRedirect
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: boolean
      responses:
        '302':
          description: Found
    post:
      tags:
      - Avatar
      summary: Upload a user avatar
      operationId: upload
      parameters:
      - name: userIdentifier
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                avatarFile:
                  type: file
              required:
              - avatarFile
      responses:
        '202':
          description: Accepted
  /v1/users/{userIdentifier}/banner:
    x-service-id: account-service
    get:
      tags:
      - Avatar
      summary: Redirect to a user's banner
      operationId: redirect_1
      parameters:
      - name: userIdentifier
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '302':
          description: Found
    post:
      tags:
      - Avatar
      summary: Upload a user banner
      operationId: upload_1
      parameters:
      - name: userIdentifier
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: file
              required:
              - file
      responses:
        '202':
          description: Accepted
  /v2/avatar/{idOrLogin}:
    x-service-id: account-service
    get:
      tags:
      - Avatar
      operationId: showGravatarAvatar
      parameters:
      - name: idOrLogin
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '302':
          description: Found
      summary: Show gravatar avatar
      x-summary-source: derived
components:
  securitySchemes:
    apiKey:
      type: apiKey
      name: apiKey
      in: query
      scheme: token
    accessToken:
      type: http
      in: header
      scheme: Bearer
externalDocs:
  description: docs.crunchdao.com
  url: https://docs.crunchdao.com
